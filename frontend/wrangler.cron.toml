name = "lilyaidatanotes-backup-cron"
main = "workers/backupCron.ts"
compatibility_date = "2024-11-01"

[triggers]
crons = ["*/5 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "lilyaidatanotes-db"
database_id = "00000000-0000-0000-0000-000000000000"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "lilyaidatanotes-backups"

[vars]
BACKUP_DROP_THRESHOLD_PERCENT = "20"
