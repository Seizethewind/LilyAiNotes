name: Frontend Tests

on:
  push:
    branches: [main]
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]
  pull_request:
    paths: ["frontend/**", ".github/workflows/frontend-tests.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        run: npm install
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Run Vitest
        working-directory: frontend
        run: npm run test
      - name: Build
        working-directory: frontend
        run: npm run build
